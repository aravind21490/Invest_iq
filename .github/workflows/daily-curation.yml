name: Daily Watchlist Curation

on:
  schedule:
    # 03:00 UTC (08:30 AM IST) Monday through Friday (prior to NSE market open)
    - cron: '0 3 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  run-curation:
    name: Run Daily Watchlist Curator
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Batch Watchlist Curation
        env:
          APP_URL: ${{ secrets.APP_URL || 'http://127.0.0.1:3000' }}
          AGENT_SERVICE_SECRET: ${{ secrets.AGENT_SERVICE_SECRET }}
        run: |
          echo "Triggering daily batch watchlist curation at $APP_URL/api/agents/curate..."
          
          HTTP_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$APP_URL/api/agents/curate" \
            -H "Content-Type: application/json" \
            -H "X-Agent-Service-Key: $AGENT_SERVICE_SECRET" \
            -d '{"batch": true}')
          
          BODY=$(echo "$HTTP_RESPONSE" | sed -e '$d')
          STATUS=$(echo "$HTTP_RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')
          
          echo "Response Status: $STATUS"
          echo "Response Body: $BODY"
          
          if [ "$STATUS" -ne 200 ]; then
            echo "::error::Curator batch run failed with HTTP status $STATUS"
            exit 1
          fi
          
          echo "Daily watchlist curation completed successfully."
